name: Swift core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-core:
    runs-on: ubuntu-latest
    container: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
  macos-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
